<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="650" viewBox="0 0 1800 650">
  <defs>
    <style>
      .panel { stroke: #2f3437; stroke-width: 2; rx: 10; }
      .title { font: 700 28px Arial, sans-serif; fill: #15191c; }
      .label { font: 600 20px Arial, sans-serif; fill: #202529; }
      .small { font: 18px Arial, sans-serif; fill: #30363a; }
      .tiny { font: 16px Arial, sans-serif; fill: #30363a; }
      .math { font: italic 21px Georgia, serif; fill: #202529; }
      .box { fill: #ffffff; stroke: #3c4449; stroke-width: 2; rx: 7; }
      .code { fill: #ffffff; stroke: #30363a; stroke-width: 2.5; rx: 5; }
      .flow { fill: none; stroke: #30363a; stroke-width: 2.6; marker-end: url(#arrow); }
      .soft { fill: none; stroke: #68737a; stroke-width: 2; stroke-dasharray: 7 6; }
      .blue { fill: #e7f0fb; stroke: #3478b8; stroke-width: 2; rx: 7; }
      .green { fill: #e9f5ec; stroke: #3e8a57; stroke-width: 2; rx: 7; }
      .orange { fill: #fff0df; stroke: #c77622; stroke-width: 2; rx: 7; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#30363a"/>
    </marker>
  </defs>

  <rect class="panel" x="8" y="8" width="430" height="634" fill="#f2f6f3"/>
  <rect class="panel" x="450" y="8" width="430" height="634" fill="#f6f5ef"/>
  <rect class="panel" x="892" y="8" width="450" height="634" fill="#f8f3ed"/>
  <rect class="panel" x="1354" y="8" width="438" height="634" fill="#f1f5fa"/>

  <text class="title" x="32" y="50">(a) Trajectory Construction</text>
  <text class="label" x="38" y="95">student u, problem p</text>
  <rect class="box" x="32" y="118" width="380" height="98"/>
  <text class="small" x="51" y="149">time-ordered submissions</text>
  <circle cx="77" cy="183" r="20" fill="#ffffff" stroke="#30363a" stroke-width="2"/>
  <circle cx="171" cy="183" r="20" fill="#ffffff" stroke="#30363a" stroke-width="2"/>
  <circle cx="359" cy="183" r="20" fill="#ffffff" stroke="#30363a" stroke-width="2"/>
  <text class="math" x="66" y="190">s1</text>
  <text class="math" x="160" y="190">s2</text>
  <text class="math" x="345" y="190">sn</text>
  <path class="flow" d="M 98 183 L 148 183"/>
  <path class="flow" d="M 192 183 L 327 183"/>
  <text class="small" x="248" y="177">...</text>

  <path class="soft" d="M 77 217 L 77 272"/>
  <path class="soft" d="M 171 217 L 171 272"/>
  <path class="soft" d="M 359 217 L 359 272"/>
  <rect class="code" x="42" y="273" width="70" height="80"/>
  <rect class="code" x="136" y="273" width="70" height="80"/>
  <rect class="code" x="324" y="273" width="70" height="80"/>
  <path d="M55 292h42M55 307h33M55 322h38" stroke="#30363a" stroke-width="5" stroke-linecap="round"/>
  <path d="M149 292h42M149 307h30M149 322h40" stroke="#30363a" stroke-width="5" stroke-linecap="round"/>
  <path d="M337 292h42M337 307h35M337 322h39" stroke="#30363a" stroke-width="5" stroke-linecap="round"/>
  <text class="tiny" x="51" y="378">code c1</text>
  <text class="tiny" x="145" y="378">code c2</text>
  <text class="tiny" x="330" y="378">code cn</text>
  <rect class="orange" x="42" y="406" width="70" height="42"/>
  <rect class="orange" x="136" y="406" width="70" height="42"/>
  <rect class="green" x="324" y="406" width="70" height="42"/>
  <text class="label" x="59" y="434">WA</text>
  <text class="label" x="153" y="434">WA</text>
  <text class="label" x="341" y="434">AC</text>
  <rect class="box" x="32" y="486" width="380" height="118"/>
  <text class="small" x="50" y="521">trajectory prefix</text>
  <text class="math" x="50" y="560">tau = [s1, s2, ..., sn]</text>
  <text class="tiny" x="50" y="587">full code + verdict sequence</text>

  <text class="title" x="474" y="50">(b) Repair Transition Mining</text>
  <rect class="box" x="478" y="83" width="374" height="90"/>
  <text class="label" x="500" y="116">Requalization</text>
  <text class="tiny" x="500" y="145">comments, blank lines, indentation</text>
  <path class="flow" d="M 665 174 L 665 216"/>
  <rect class="box" x="478" y="220" width="374" height="220"/>
  <text class="label" x="500" y="254">Automatic filters</text>
  <circle cx="511" cy="291" r="8" fill="#3e8a57"/>
  <text class="small" x="532" y="298">eventual AC trajectory</text>
  <circle cx="511" cy="335" r="8" fill="#3e8a57"/>
  <text class="small" x="532" y="342">token distance &lt;= 0.5</text>
  <circle cx="511" cy="379" r="8" fill="#3e8a57"/>
  <text class="small" x="532" y="386">productive / non-worsening</text>
  <path class="flow" d="M 665 441 L 665 481"/>
  <rect class="green" x="478" y="485" width="374" height="119"/>
  <text class="label" x="500" y="520">next-repair examples</text>
  <text class="math" x="500" y="557">[s1, ..., si]  ->  c(i+1)</text>
  <text class="tiny" x="500" y="584">all valid trajectory prefixes</text>

  <text class="title" x="916" y="50">(c) Dual-Source Generation</text>
  <rect class="box" x="918" y="84" width="398" height="100"/>
  <text class="label" x="940" y="118">problem context + trajectory</text>
  <text class="tiny" x="940" y="149">metadata, testcase I/O, full code, verdicts</text>
  <path class="flow" d="M 1117 185 L 1117 226"/>
  <rect class="blue" x="918" y="230" width="190" height="126"/>
  <text class="label" x="943" y="267">SFT generator</text>
  <text class="tiny" x="943" y="297">full-code NLL</text>
  <text class="tiny" x="943" y="326">4 candidates</text>
  <rect class="orange" x="1120" y="230" width="196" height="126"/>
  <text class="label" x="1139" y="267">Trajectory generator</text>
  <text class="tiny" x="1139" y="297">changed-token</text>
  <text class="tiny" x="1139" y="320">counterfactual loss</text>
  <text class="tiny" x="1139" y="343">2 candidates</text>
  <path class="flow" d="M 1013 357 L 1013 407 L 1117 407"/>
  <path class="flow" d="M 1218 357 L 1218 407 L 1135 407"/>
  <rect class="box" x="918" y="420" width="398" height="184"/>
  <text class="label" x="940" y="453">candidate fixed programs</text>
  <rect class="code" x="945" y="480" width="70" height="80"/>
  <rect class="code" x="1037" y="480" width="70" height="80"/>
  <rect class="code" x="1129" y="480" width="70" height="80"/>
  <rect class="code" x="1221" y="480" width="70" height="80"/>
  <path d="M958 499h42M958 514h33M958 529h38M1050 499h42M1050 514h33M1050 529h38M1142 499h42M1142 514h33M1142 529h38M1234 499h42M1234 514h33M1234 529h38" stroke="#30363a" stroke-width="5" stroke-linecap="round"/>
  <text class="tiny" x="944" y="584">SFT pool</text>
  <text class="tiny" x="1128" y="584">trajectory pool</text>

  <text class="title" x="1378" y="50">(d) Execution-Aware Selection</text>
  <rect class="box" x="1380" y="83" width="386" height="90"/>
  <text class="label" x="1402" y="116">Execute on selection cases</text>
  <text class="tiny" x="1402" y="145">pass rate, severity, code distance</text>
  <path class="flow" d="M 1573 174 L 1573 210"/>
  <rect class="green" x="1380" y="214" width="386" height="96"/>
  <text class="label" x="1402" y="248">Productive execution guard Q</text>
  <text class="tiny" x="1402" y="280">improve, do not regress, else abstain</text>
  <path class="flow" d="M 1476 311 L 1476 354"/>
  <path class="flow" d="M 1668 311 L 1668 354"/>
  <rect class="blue" x="1380" y="358" width="190" height="96"/>
  <text class="label" x="1402" y="392">SFT choice</text>
  <text class="math" x="1402" y="426">Q(Hsft)</text>
  <rect class="orange" x="1576" y="358" width="190" height="96"/>
  <text class="label" x="1598" y="392">Mixed choice</text>
  <text class="math" x="1598" y="426">Q(Hsft2 + Htraj)</text>
  <path class="flow" d="M 1476 455 L 1476 499 L 1543 499"/>
  <path class="flow" d="M 1670 455 L 1670 499 L 1601 499"/>
  <rect class="box" x="1484" y="488" width="178" height="62"/>
  <text class="label" x="1505" y="516">strict source guard</text>
  <text class="tiny" x="1496" y="540">use trajectory only if pass increases</text>
  <path class="flow" d="M 1573 551 L 1573 583"/>
  <rect class="green" x="1431" y="586" width="284" height="42"/>
  <text class="label" x="1463" y="615">next fixed program / abstain</text>
</svg>
